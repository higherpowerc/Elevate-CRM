services:
  - type: web
    name: elevate-crm
    runtime: bun
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: PORT
        value: 3001
      - key: COOKIE_SECURE
        value: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
